<!DOCTYPE html>
<html lang="tr">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>Sürüş & Rota Asistanı</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <link rel="stylesheet" href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css" />
    <link rel="stylesheet" href="https://unpkg.com/leaflet-routing-machine@latest/dist/leaflet-routing-machine.css" />
    <style>
        #map { height: calc(100vh - 130px); width: 100%; z-index: 0; }
        .leaflet-routing-container { 
            background: #0f172a !important; 
            color: #f8fafc !important; 
            padding: 8px; 
            border-radius: 8px; 
            font-size: 11px;
            max-height: 180px;
            overflow-y: auto;
            border: 1px solid #334155;
        }
    </style>
</head>
<body class="bg-slate-900 text-slate-100 flex flex-col h-screen overflow-hidden font-sans">
    <header class="bg-slate-800 p-2.5 shadow-xl flex flex-col gap-2 border-b border-slate-700 z-50 relative">
        <div class="flex justify-between items-center">
            <h1 class="text-sm font-bold flex items-center gap-1.5 text-blue-400">
                <span>🚛</span> Sürüş & Rota Asistanı
            </h1>
            <span id="offline-status" class="text-[10px] bg-emerald-500 text-slate-950 font-bold px-2 py-0.5 rounded-full">Aktif</span>
        </div>
        <div class="relative flex gap-2">
            <div class="relative w-full">
                <input type="text" id="destinationInput" autocomplete="off" placeholder="Şehir veya yer yazın (Örn: Eskişehir, Ankara, İstanbul...)" class="w-full bg-slate-950 border border-slate-700 rounded-lg px-3 py-2 text-xs text-white placeholder-slate-400 focus:outline-none focus:ring-2 focus:ring-blue-500">
                <div id="suggestions" class="hidden absolute left-0 right-0 top-full mt-1 bg-slate-900 border border-slate-700 rounded-lg shadow-2xl max-h-48 overflow-y-auto z-50 divide-y divide-slate-800"></div>
            </div>
            <button onclick="startNavigationDirect()" class="bg-blue-600 hover:bg-blue-500 px-3.5 py-2 rounded-lg text-xs font-bold text-white whitespace-nowrap transition active:scale-95">Yol Tarifi Al</button>
        </div>
    </header>

    <div id="map"></div>

    <nav class="bg-slate-800 border-t border-slate-700 p-3 flex justify-between items-center h-[55px] shadow-2xl z-40">
        <div id="routeInfo" class="text-xs text-slate-300 font-medium truncate max-w-[70%]">
            <span>Hedef girilmedi. Rota bekleniyor...</span>
        </div>
        <button onclick="stopNavigation()" class="bg-red-600 hover:bg-red-500 px-3 py-1.5 rounded-lg text-xs font-bold text-white hidden whitespace-nowrap transition active:scale-95" id="endTripBtn">Sürüşü Bitir</button>
    </nav>

    <script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js"></script>
    <script src="https://unpkg.com/leaflet-routing-machine@latest/dist/leaflet-routing-machine.js"></script>
    <script src="app.js"></script>
</body>
</html>
